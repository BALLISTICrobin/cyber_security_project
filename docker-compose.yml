networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: server
    hostname: server
    environment:
      - CC_ALGO=${CC_ALGO:-cubic}
      - DEFENSE=${DEFENSE:-off}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      labnet:
        ipv4_address: 172.28.0.10
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true

  attacker:
    build:
      context: .
      dockerfile: docker/attacker/Dockerfile
    container_name: attacker
    hostname: attacker
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 172.28.0.20
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true

  observer:
    build:
      context: .
      dockerfile: docker/observer/Dockerfile
    container_name: observer
    hostname: observer
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 172.28.0.30
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: dashboard
    # Deliberately NOT on labnet: the dashboard never talks to server/attacker/
    # observer over the network -- it drives them via `docker compose exec`
    # through the Docker socket below, so it doesn't need (and shouldn't have)
    # direct network access into the attack/defense traffic path.
    working_dir: ${PWD}
    volumes:
      # Docker socket: lets this container run `docker compose ...` against
      # the SAME daemon the host uses (controls sibling containers).
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path inside as outside: required so this container's
      # `docker compose` CLI resolves the compose file and build contexts to
      # paths the daemon can actually see (see docker/dashboard/Dockerfile).
      - ${PWD}:${PWD}
    ports:
      - "8787:8787"
    command: ["python3", "${PWD}/dashboard/server.py"]
    depends_on:
      - server
      - attacker
      - observer
